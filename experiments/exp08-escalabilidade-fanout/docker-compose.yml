name: syncli-exp08

networks:
  expnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.8.0/24

services:
  nodeA:
    image: syncli-experiments-node
    hostname: nodeA
    networks: [expnet]
    volumes:
      - ./results/sync_A:/sync
      - ./results:/results
    environment:
      SYNCLI_EXP_LOG: /results/nodeA.jsonl
    command:
      - "--group"
      - "exp08"
      - "--dir"
      - "/sync"
      - "--auto-join"
      - "--peer"
      - "node1:9001"
      - "--peer"
      - "node2:9001"
      - "--peer"
      - "node3:9001"
      - "--peer"
      - "node4:9001"
      - "--peer"
      - "node5:9001"
      - "--peer"
      - "node6:9001"
      - "--peer"
      - "node7:9001"

  node1:
    image: syncli-experiments-node
    hostname: node1
    networks: [expnet]
    volumes:
      - ./results/sync_1:/sync
      - ./results:/results
    environment:
      SYNCLI_EXP_LOG: /results/node1.jsonl
    command: ["--group", "exp08", "--dir", "/sync", "--auto-join", "--peer", "nodeA:9001"]

  node2:
